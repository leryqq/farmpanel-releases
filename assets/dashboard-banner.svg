<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FarmPanel desktop app: Accounts screen showing a sidebar with Dashboard, Accounts, Workflows, Monitoring, Sandboxes, Servers, Matchmaking, Lobby and Logs, and an account grid with status, login, nickname, workflow, sandbox and last-login columns">
  <defs>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="378" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="1200" height="380" fill="#0E1116"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1200" height="32" fill="#151A21"/>
    <rect x="0" y="31" width="1200" height="1" fill="#2D3641"/>
    <rect x="16" y="11" width="10" height="10" rx="2" fill="#3D8BFE"/>
    <text x="34" y="20" font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#E6EAF0">FarmPanel</text>
    <circle cx="1142" cy="16" r="4" fill="#3E4854"/>
    <circle cx="1162" cy="16" r="4" fill="#3E4854"/>
    <circle cx="1182" cy="16" r="4" fill="#E5484D"/>

    <!-- sidebar -->
    <rect x="0" y="32" width="200" height="324" fill="#151A21"/>
    <rect x="200" y="32" width="1" height="324" fill="#2D3641"/>

    <g font-family="Segoe UI, Inter, sans-serif" font-size="12.5">
      <text x="44" y="62" fill="#A6B0BD">Dashboard</text>

      <rect x="0" y="78" width="200" height="28" fill="#1B2129"/>
      <rect x="0" y="78" width="3" height="28" fill="#3D8BFE"/>
      <rect x="20" y="85" width="14" height="14" rx="3" fill="#3D8BFE"/>
      <text x="44" y="96" fill="#E6EAF0" font-weight="600">Accounts</text>

      <text x="44" y="126" fill="#A6B0BD">Workflows</text>
      <text x="44" y="156" fill="#A6B0BD">Monitoring</text>
      <text x="44" y="186" fill="#A6B0BD">Sandboxes</text>
      <text x="44" y="216" fill="#A6B0BD">Servers</text>
      <text x="44" y="246" fill="#A6B0BD">Matchmaking</text>
      <text x="44" y="276" fill="#A6B0BD">Lobby</text>
      <text x="44" y="306" fill="#A6B0BD">Logs</text>

      <rect x="20" y="322" width="160" height="1" fill="#2D3641"/>
      <text x="44" y="344" fill="#6C7785">Settings</text>
    </g>

    <!-- toolbar -->
    <rect x="224" y="50" width="118" height="28" rx="5" fill="#3D8BFE"/>
    <text x="283" y="68" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#0E1116" text-anchor="middle" font-weight="600">Add accounts</text>

    <rect x="354" y="50" width="240" height="28" rx="5" fill="#1B2129" stroke="#2D3641"/>
    <text x="368" y="68" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#6C7785">Search accounts…</text>

    <g font-family="Segoe UI, Inter, sans-serif" font-size="11.5">
      <rect x="608" y="52" width="80" height="24" rx="12" fill="#1B2129"/>
      <text x="648" y="68" fill="#A6B0BD" text-anchor="middle">All · 128</text>

      <rect x="696" y="52" width="104" height="24" rx="12" fill="#0F2440"/>
      <circle cx="712" cy="64" r="3" fill="#3D8BFE"/>
      <text x="756" y="68" fill="#7BBAFF" text-anchor="middle">Running · 86</text>

      <rect x="808" y="52" width="92" height="24" rx="12" fill="#3D1418"/>
      <circle cx="824" cy="64" r="3" fill="#E5484D"/>
      <text x="862" y="68" fill="#FF7A7E" text-anchor="middle">Errors · 3</text>
    </g>

    <!-- grid header -->
    <g font-family="Segoe UI, Inter, sans-serif" font-size="10.5" fill="#6C7785" letter-spacing="0.5">
      <text x="224" y="104">STATUS</text>
      <text x="330" y="104">LOGIN</text>
      <text x="560" y="104">NICKNAME</text>
      <text x="760" y="104">WORKFLOW</text>
      <text x="900" y="104">SANDBOX</text>
      <text x="1030" y="104">LAST LOGIN</text>
    </g>
    <rect x="224" y="112" width="952" height="1" fill="#2D3641"/>

    <!-- grid rows -->
    <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12">
      <!-- row 1: running -->
      <rect x="224" y="122" width="952" height="30" fill="#151A21"/>
      <circle cx="232" cy="140" r="4" fill="#3D8BFE"/>
      <text x="244" y="144" font-family="Segoe UI, Inter, sans-serif" fill="#7BBAFF">Running</text>
      <text x="330" y="144" fill="#E6EAF0">acct_2418</text>
      <text x="560" y="144" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">ShadowByte</text>
      <text x="760" y="144" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">wf_ranked_warmup</text>
      <text x="900" y="144" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-001</text>
      <text x="1030" y="144" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">2m ago</text>

      <!-- row 2: running -->
      <circle cx="232" cy="170" r="4" fill="#3D8BFE"/>
      <text x="244" y="174" font-family="Segoe UI, Inter, sans-serif" fill="#7BBAFF">Running</text>
      <text x="330" y="174" fill="#E6EAF0">acct_8842</text>
      <text x="560" y="174" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">Nordwind</text>
      <text x="760" y="174" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">wf_daily_login</text>
      <text x="900" y="174" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-002</text>
      <text x="1030" y="174" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">5m ago</text>

      <!-- row 3: starting -->
      <rect x="224" y="182" width="952" height="30" fill="#151A21"/>
      <circle cx="232" cy="200" r="4" fill="#9C7CFF"/>
      <text x="244" y="204" font-family="Segoe UI, Inter, sans-serif" fill="#C5AFFF">Starting</text>
      <text x="330" y="204" fill="#E6EAF0">acct_1190</text>
      <text x="560" y="204" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">Cobalt99</text>
      <text x="760" y="204" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">wf_ranked_warmup</text>
      <text x="900" y="204" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-003</text>
      <text x="1030" y="204" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">just now</text>

      <!-- row 4: warning -->
      <circle cx="232" cy="230" r="4" fill="#E8B33A"/>
      <text x="244" y="234" font-family="Segoe UI, Inter, sans-serif" fill="#F0CB6E">Warning</text>
      <text x="330" y="234" fill="#E6EAF0">acct_3327</text>
      <text x="560" y="234" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">Driftwood</text>
      <text x="760" y="234" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">wf_case_open</text>
      <text x="900" y="234" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-004</text>
      <text x="1030" y="234" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">18m ago</text>

      <!-- row 5: error -->
      <rect x="224" y="242" width="952" height="30" fill="#151A21"/>
      <circle cx="232" cy="260" r="4" fill="#E5484D"/>
      <text x="244" y="264" font-family="Segoe UI, Inter, sans-serif" fill="#FF7A7E">Error</text>
      <text x="330" y="264" fill="#E6EAF0">acct_5501</text>
      <text x="560" y="264" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">Glasswing</text>
      <text x="760" y="264" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">wf_daily_login</text>
      <text x="900" y="264" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-005</text>
      <text x="1030" y="264" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">41m ago</text>

      <!-- row 6: stopped -->
      <circle cx="232" cy="290" r="4" fill="#6C7785"/>
      <text x="244" y="294" font-family="Segoe UI, Inter, sans-serif" fill="#A6B0BD">Stopped</text>
      <text x="330" y="294" fill="#E6EAF0">acct_7710</text>
      <text x="560" y="294" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">Northlane</text>
      <text x="760" y="294" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">—</text>
      <text x="900" y="294" fill="#A6B0BD" font-family="Segoe UI, Inter, sans-serif">sbx-006</text>
      <text x="1030" y="294" fill="#6C7785" font-family="Segoe UI, Inter, sans-serif">2h ago</text>
    </g>

    <!-- footer status bar -->
    <rect x="0" y="356" width="1200" height="24" fill="#151A21"/>
    <rect x="0" y="356" width="1200" height="1" fill="#2D3641"/>
    <text x="16" y="372" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#6C7785">128 accounts · 86 running · 3 errors</text>
    <text x="1184" y="372" font-family="Consolas, 'JetBrains Mono', monospace" font-size="10.5" fill="#6C7785" text-anchor="end">FarmPanel</text>
  </g>

  <rect x="1" y="1" width="1198" height="378" rx="10" fill="none" stroke="#2D3641" stroke-width="1.5"/>
</svg>
